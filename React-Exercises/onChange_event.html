<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React-basics</title>
</head>
<body>
    <div class="js-container"></div>
    
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type = "text/babel">
        function Button () {
            const [inputValue, setInputValue] = React.useState("")
            function showInputValue(e) {
              setInputValue(e.target.value);
            }
           return (
            <>
              <input type = "text" placeholder = "Type a name here" onChange = {showInputValue} value = {inputValue} />
              <button onClick = {() => {setInputValue("")}}>Reset</button>
              <button onClick = {() => {setInputValue("Alice")}}>Example</button>
              <p>Hello {inputValue}</p>
            </>
           )
        }

        function App () {
            
            return (
                <>
                  <Button />
                </>
            )
        }

   const container = document.querySelector('.js-container');
   ReactDOM.createRoot(container).render(<App />)
    </script>
</body>
</html>
