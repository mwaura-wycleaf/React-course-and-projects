<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React-basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function CartItem( { name, price, discountPrice, imageSrc } ) {
        return (
          <>
          <div>
           <img src = {imageSrc} />
          </div>
            {!discountPrice ? (
              <>
                <p>{name}</p>
                <p>Price: ${price}</p>
                <button>Add to Cart</button>
              </>
            ) : (
              <>
                <p>{name}</p>
                <del><p>Price: ${price}</p></del>
                <p>Discount price: ${discountPrice}</p>
                <button>Add to Cart</button>
              </>
            )}
          </>
        );
      }

      function App() {
        return (
          <>
            <CartItem name="Cotton socks" price="10.90" discountPrice = "5.45" imageSrc = "cotton-socks.png" />
            <CartItem name="Tennis balls" price="6.00" imageSrc = "tennis-balls.png" />
            <CartItem name="Plain T-shirt" price="7.99" imageSrc = "plain-t-shirt.png" />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
