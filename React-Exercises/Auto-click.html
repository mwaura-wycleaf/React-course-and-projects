<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>react-date</title>
    <style>
        .flex-container {
            display: flex;
            height: 100vh;
            background-color: rgb(222, 222, 222);
            align-items: center;
            justify-content: center;
        }
        .click {
            background-color: rgb(25,135, 84);
            color: white;
            padding: 9px 16px;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
        }

        
    </style>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type = "text/babel">
        function AutoClick() {
            const [count, setCount] = React.useState(0);
            const [isAutoRunning, setIsAutoRunning] = React.useState(false);
            
            
            
            React.useEffect(() =>{
                let intervalId;
                if (isAutoRunning){
                   intervalId = setInterval(() => {
                  setCount(prevCount=> prevCount + 1);
                }, 1000)
                }
                

                return () => clearInterval(intervalId);
            }, [isAutoRunning])
            
            return (
                <div className = "flex-container">
                  <button className = "click" onClick = {() => {setCount(count + 1)}} >Clicked {count} times</button>
                  <button className = "click" onClick = {() => {setCount(0)}}>Reset</button>
                  <button className = "click" onClick = {() => {setIsAutoRunning(!isAutoRunning)}} >{isAutoRunning ? "Stop" : "Start"} Auto Click</button>
                  
                </div>
            )
        }
        
        
        function App (){
            return (
                <>
                 <AutoClick />  
                </>
            )
        }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />)
    </script>
</body>
</html>
